name: Release

# Manual release: Crowdin sync first, then checks, then release.
# Run from the Actions tab on the main branch with the version
# from gradle.properties (for example 2.0.0-beta). The workflow creates
# the v<version> tag and the GitHub release itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version from gradle.properties (example: 2.0.0-beta)"
        required: true
        type: string
        default: "2.0.0-beta"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  crowdin:
    name: Sync Crowdin translations
    environment: main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check Crowdin secrets are set
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN secrets must be set in the main environment."
            exit 1
          fi

      - name: Download latest translations and commit them
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: false
          commit_message: "chore(l10n): sync Crowdin translations for ${{ inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  checks:
    name: Checks
    needs: crowdin
    uses: ./.github/workflows/checks.yml

  release:
    name: Build release APKs and publish
    needs: checks
    environment: main
    runs-on: ubuntu-latest
    outputs:
      release_tag: v${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify version matches gradle.properties
        run: |
          APP_VERSION_NAME="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [ "${{ inputs.version }}" != "$APP_VERSION_NAME" ]; then
            echo "Input version '${{ inputs.version }}' does not match APP_VERSION_NAME '$APP_VERSION_NAME' in gradle.properties."
            exit 1
          fi
          echo "Version: ${{ inputs.version }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # Signing: one keystore for beta and stable (Iqbal's decision
      # 2026-11-11): ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD +
      # ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD secrets in the main
      # environment. Fail fast when they are missing: a release silently
      # signed with a throwaway key could never be updated in place.
      - name: Set up signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing keystore secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD must all be set in the main environment. See docs/RELEASE.md."
            exit 1
          fi
          echo "Using the unified release keystore."
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease -Pstartune.enableAbiSplits=true

      - name: Verify and rename split APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          mkdir -p release-apks
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
            cp "$apk" "release-apks/startune-music-${{ inputs.version }}-$abi.apk"
          done
          ls -lah release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: startune-music-${{ inputs.version }}
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ inputs.version }}
          tag_name: v${{ inputs.version }}
          target_commitish: main
          files: release-apks/*.apk
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.version, '-') }}
          generate_release_notes: false

  release-notes:
    name: Attach Release Notes
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
