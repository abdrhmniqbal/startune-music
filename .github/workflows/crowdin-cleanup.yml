name: Crowdin cleanup (one-off)

# One-off helper: the 27 Android source files already in Crowdin still carry
# the old (wrong) export pattern, and uploading does not update it, so they
# must be deleted for the next sync to recreate them correctly. The old Expo
# files under branch master are deleted too. List mode only prints what
# would be deleted; delete mode requires confirm=DELETE. Remove this file
# after the cleanup succeeds.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = show what would be deleted, delete = delete it"
        required: true
        type: choice
        options: [list, delete]
        default: list
      confirm:
        description: "Type DELETE to confirm delete mode"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  cleanup:
    name: Crowdin cleanup
    environment: main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: List or delete stale Crowdin files
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: python3 - <<'EOF'
          import glob
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          API = "https://api.crowdin.com/api/v2"
          pid = os.environ["CROWDIN_PROJECT_ID"]
          token = os.environ["CROWDIN_PERSONAL_TOKEN"]
          mode = os.environ.get("MODE", "list")
          confirm = os.environ.get("CONFIRM", "")

          def call(method, path):
              req = urllib.request.Request(
                  API + path, method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read().decode()
                      return r.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:500]

          def list_all(path):
              out, offset, limit = [], 0, 500
              while True:
                  status, body = call("GET", f"{path}?limit={limit}&offset={offset}")
                  if status != 200:
                      print(f"GET {path} failed: {status} {body}")
                      sys.exit(1)
                  items = body["data"]
                  out.extend(d["data"] for d in items)
                  if len(items) < limit:
                      return out
                  offset += limit

          # The 27 English source files, derived from the repo itself.
          android_names = {
              os.path.basename(p)
              for p in (glob.glob("app/src/main/res/values/strings*.xml")
                        + ["app/src/main/res/values/plurals.xml"])
          }
          print(f"Android source files in repo: {len(android_names)}")

          branches = list_all(f"/projects/{pid}/branches")
          master_id = next((b["id"] for b in branches if b["name"] == "master"), None)
          print(f"Branch 'master' id: {master_id}")

          files = list_all(f"/projects/{pid}/files")
          print(f"Files in project: {len(files)}")
          android, expo, kept = [], [], []
          for f in files:
              if f.get("branchId") is None and f["name"] in android_names:
                  android.append(f)
              elif master_id is not None and f.get("branchId") == master_id:
                  expo.append(f)
              else:
                  kept.append(f)

          def show(label, items):
              print(f"{label}: {len(items)}")
              for f in sorted(items, key=lambda x: x["name"]):
                  print(f"  id={f['id']} name={f['name']} path={f.get('path')} "
                        f"type={f.get('type')} branchId={f.get('branchId')}")

          show("WOULD DELETE (Android, root)", android)
          show("WOULD DELETE (Expo, branch master)", expo)
          show("KEPT (anything else)", kept)

          if mode == "list":
              print("List mode: nothing deleted.")
              sys.exit(0)
          if confirm != "DELETE":
              print("Delete mode requires confirm=DELETE. Nothing deleted.")
              sys.exit(1)
          failed = 0
          for f in android + expo:
              status, body = call("DELETE", f"/projects/{pid}/files/{f['id']}")
              print(f"DELETE id={f['id']} name={f['name']}: {status}")
              if status not in (200, 204):
                  print(f"  failed: {body}")
                  failed += 1
          if failed:
              print(f"{failed} delete(s) failed.")
              sys.exit(1)
          print(f"Deleted {len(android) + len(expo)} file(s).")
          EOF
