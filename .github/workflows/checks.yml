name: Checks

# Reusable checks: compile, lint, unit tests. Called by pr-checks.yml and
# release.yml so both run exactly the same gate.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Compile, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Compile (resources, KSP, Kotlin)
        run: ./gradlew :app:mergeDebugResources :app:kspDebugKotlin :app:compileDebugKotlin

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
