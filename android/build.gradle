// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

ext {
  compileSdkVersion = (findProperty('android.compileSdkVersion') ?: findProperty('AudioBrowser_compileSdkVersion') ?: 36).toInteger()
  targetSdkVersion = (findProperty('android.targetSdkVersion') ?: findProperty('AudioBrowser_targetSdkVersion') ?: 36).toInteger()
  minSdkVersion = (findProperty('android.minSdkVersion') ?: findProperty('AudioBrowser_minSdkVersion') ?: 24).toInteger()
  ndkVersion = findProperty('android.ndkVersion') ?: findProperty('AudioBrowser_ndkVersion') ?: '28.2.13676358'
  kotlinVersion = findProperty('android.kotlinVersion') ?: findProperty('AudioBrowser_kotlinVersion') ?: '2.2.21'
  // Pin cast-framework: react-native-google-cast defaults it to '+' (latest),
  // and 23.0.0 pulls mediarouter 1.9.0-beta01, which needs SDK 37 + AGP 9.1.
  // 22.3.1 is the newest version whose mediarouter (1.8.0-beta01) still fits
  // this project's SDK 36 + AGP 8.12.
  castFrameworkVersion = '22.3.1'
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
  }
}

subprojects { subproject ->
  subproject.plugins.withId('com.android.library') {
    subproject.android {
      compileSdk rootProject.ext.compileSdkVersion
    }
  }

  subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
      jvmTarget = '17'
    }
  }

}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
